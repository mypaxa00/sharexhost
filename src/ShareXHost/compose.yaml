services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: sharexhost
      POSTGRES_USER: sharexhost
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
#     POSTGRES_PASSWORD: or-use-direct-password-instead-of-secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    secrets:
      - postgres_password
    healthcheck: 
        test: ["CMD-SHELL", "pg_isready -U sharexhost -d sharexhost"]
        interval: 10s
        timeout: 5s
        retries: 5
    
  
  app:
    build:
      context: ../..
      dockerfile: src/ShareXHost/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - storage_data:/app/Storage
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
      - jwt_key

volumes:
  postgres_data:
  storage_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
    
  jwt_key:
    file: ./secrets/jwt_key.txt